name: Collect news and deploy

on:
  schedule:
    - cron: "0 * * * *"  # mỗi giờ
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect news
        run: python scripts/collect_news.py

      - name: Filter ticker news
        run: python scripts/filter_tickers.py

      - name: Build site
        run: python scripts/build_site.py

      - name: Commit updated data
        run: |
          git config user.name "auto-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: update news data"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
